<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Signed in · Kan Live Clips</title><style>body{margin:0;background:#101018;color:#e8e8f0;font:16px/1.6 system-ui,Segoe UI,Arial,sans-serif}main{max-width:720px;margin:0 auto;padding:40px 20px}h1{color:#fff}h2{color:#2de1ff;margin-top:32px}a{color:#ff5c96}img{width:96px;height:96px;border-radius:16px}code,textarea{background:#1c1c28;color:#fff;border:1px solid #333;border-radius:8px}textarea{width:100%;padding:10px;font:14px monospace}button{background:#ff2d78;color:#fff;border:0;border-radius:8px;padding:10px 18px;font-weight:700;cursor:pointer}nav a{margin-right:16px}</style></head><body><main>
<h1>Almost done</h1>
<p id="msg">Copy this whole address and paste it into the window that asked for it.</p>
<textarea id="addr" rows="4" readonly></textarea>
<p><button id="copy">Copy</button></p>
<script>
var a = document.getElementById("addr"); a.value = location.href;
var q = new URLSearchParams(location.search);
if (q.get("error")) document.getElementById("msg").textContent = "Sign-in was not completed: " + q.get("error") + ". Start the sign-in again.";
document.getElementById("copy").onclick = function () { a.select(); document.execCommand("copy"); this.textContent = "Copied"; };
</script>
</main></body></html>
