<!doctype html><html><head><meta charset="utf-8"><title>Kan Live Clips - Architecture</title>
<style>body{margin:0;background:#fff;font:15px Segoe UI,Arial,sans-serif;color:#111}h1{font-size:22px;margin:18px 24px 4px}p{margin:0 24px 8px;color:#444}</style></head><body>
<h1>Kan Live Clips — Architecture (YouTube Data API project 119872396853)</h1>
<p>Personal desktop tool running on the owner's own computer. Only one Google account and one channel ("kan") are ever used.</p>
<svg width="1200" height="560" viewBox="0 0 1200 560" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI,Arial" font-size="14">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<style>.b{fill:#f4f6fb;stroke:#334;stroke-width:1.5;rx:10}.y{fill:#ffecec;stroke:#c00;stroke-width:2;rx:10}.g{fill:#eef8ee;stroke:#383;stroke-width:1.5;rx:10}.t{font-weight:700}.l{stroke:#333;stroke-width:1.6;fill:none;marker-end:url(#a)}.s{font-size:12px;fill:#444}</style>
<rect x="20" y="40" width="230" height="110" class="b"/><text x="35" y="68" class="t">Public live streams</text><text x="35" y="92" class="s">Twitch and Kick (public video</text><text x="35" y="110" class="s">and public chat, read-only)</text>
<rect x="320" y="20" width="560" height="400" fill="none" stroke="#888" stroke-dasharray="6 4" rx="14"/><text x="335" y="44" class="t">Owner's computer (Kan Live Clips)</text>
<rect x="345" y="60" width="240" height="90" class="b"/><text x="360" y="88" class="t">1. Watcher</text><text x="360" y="110" class="s">records streams, measures chat</text><text x="360" y="128" class="s">and loudness to find hype moments</text>
<rect x="615" y="60" width="240" height="90" class="b"/><text x="630" y="88" class="t">2. Clip maker</text><text x="630" y="110" class="s">cuts a 28 s 9:16 Short (ffmpeg),</text><text x="630" y="128" class="s">credits the streamer</text>
<rect x="615" y="180" width="240" height="90" class="b"/><text x="630" y="208" class="t">3. Title writer</text><text x="630" y="230" class="s">sends 5 frames to Google Gemini</text><text x="630" y="248" class="s">API for a title (optional)</text>
<rect x="345" y="180" width="240" height="90" class="b"/><text x="360" y="208" class="t">4. Publisher</text><text x="360" y="230" class="s">one upload at a time, best clip first,</text><text x="360" y="248" class="s">stops when the daily quota is used</text>
<rect x="345" y="300" width="510" height="100" class="g"/><text x="360" y="328" class="t">Local storage (owner's disk only)</text><text x="360" y="350" class="s">clips + metadata JSON; OAuth token file (.secrets/token.json, scope youtube.upload);</text><text x="360" y="368" class="s">no database, no server, no other users' data. Token deleted on revoke.</text>
<rect x="950" y="160" width="230" height="130" class="y"/><text x="965" y="188" class="t">YouTube Data API v3</text><text x="965" y="212" class="s">videos.insert (1,600 units)</text><text x="965" y="230" class="s">channels.list mine=true (1 unit)</text><text x="965" y="254" class="s">→ owner's channel "kan" only</text>
<rect x="950" y="330" width="230" height="90" class="b"/><text x="965" y="358" class="t">Google OAuth 2.0</text><text x="965" y="380" class="s">owner signs in once in the</text><text x="965" y="398" class="s">browser; consent: youtube.upload</text>
<rect x="950" y="40" width="230" height="80" class="b"/><text x="965" y="68" class="t">Google Gemini API</text><text x="965" y="90" class="s">title text only</text>
<path d="M250,95 L345,105" class="l"/><path d="M585,105 L615,105" class="l"/><path d="M735,150 L735,180" class="l"/><path d="M615,225 L585,225" class="l"/>
<path d="M585,215 C760,300 860,240 950,225" class="l"/><path d="M855,215 C900,120 920,90 950,80" class="l"/>
<path d="M1065,330 L1065,290" class="l"/><path d="M950,375 L855,360" class="l"/><path d="M465,270 L465,300" class="l"/>
<text x="20" y="470" class="s">Data flow: public stream → local clip → (title from Gemini) → videos.insert to the owner's own channel. No YouTube data from other users is read or stored;</text>
<text x="20" y="490" class="s">the only YouTube data kept is the OAuth token and the owner's channel ID, on the owner's computer. Access can be revoked at myaccount.google.com/permissions.</text>
</svg></body></html>
